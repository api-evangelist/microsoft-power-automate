naftiko: 1.0.0-alpha2
info:
  label: Microsoft Power Automate Management API — Flow Permissions
  description: 'Microsoft Power Automate Management API — Flow Permissions. 2 operations. Lead operation: Microsoft Power
    Automate List Flow Owners. Self-contained Naftiko capability covering one Microsoft Power Automate business surface.'
  tags:
  - Microsoft Power Automate
  - Flow Permissions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_POWER_AUTOMATE_API_KEY: MICROSOFT_POWER_AUTOMATE_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-flow-permissions
    baseUri: https://api.flow.microsoft.com
    description: Microsoft Power Automate Management API — Flow Permissions business capability. Self-contained, no shared
      references.
    resources:
    - name: providers-Microsoft.ProcessSimple-environments-environmentName-flows-flowName-ow
      path: /providers/Microsoft.ProcessSimple/environments/{environmentName}/flows/{flowName}/owners
      operations:
      - name: listflowowners
        method: GET
        description: Microsoft Power Automate List Flow Owners
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: environmentName
          in: path
          type: string
          description: The name of the environment.
          required: true
        - name: flowName
          in: path
          type: string
          description: The name or ID of the flow.
          required: true
      - name: modifyflowowners
        method: POST
        description: Microsoft Power Automate Modify Flow Owners
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: environmentName
          in: path
          type: string
          description: The name of the environment.
          required: true
        - name: flowName
          in: path
          type: string
          description: The name or ID of the flow.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_POWER_AUTOMATE_API_KEY}}'
  exposes:
  - type: rest
    namespace: management-flow-permissions-rest
    port: 8080
    description: REST adapter for Microsoft Power Automate Management API — Flow Permissions. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/providers/microsoft-processsimple/environments/{environmentname}/flows/{flowname}/owners
      name: providers-microsoft-processsimple-environments-environmentname-flows-flowname-ow
      description: REST surface for providers-Microsoft.ProcessSimple-environments-environmentName-flows-flowName-ow.
      operations:
      - method: GET
        name: listflowowners
        description: Microsoft Power Automate List Flow Owners
        call: management-flow-permissions.listflowowners
        with:
          environmentName: rest.environmentName
          flowName: rest.flowName
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: modifyflowowners
        description: Microsoft Power Automate Modify Flow Owners
        call: management-flow-permissions.modifyflowowners
        with:
          environmentName: rest.environmentName
          flowName: rest.flowName
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-flow-permissions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Power Automate Management API — Flow Permissions. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: microsoft-power-automate-list-flow
      description: Microsoft Power Automate List Flow Owners
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-flow-permissions.listflowowners
      with:
        environmentName: tools.environmentName
        flowName: tools.flowName
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-power-automate-modify-flow
      description: Microsoft Power Automate Modify Flow Owners
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: management-flow-permissions.modifyflowowners
      with:
        environmentName: tools.environmentName
        flowName: tools.flowName
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
