      operations:
      - name: cancelflowrun
        method: POST
        description: Microsoft Power Automate Cancel Flow Run
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: environmentName
          in: path
          type: string
          description: The name of the environment.
          required: true
        - name: flowName
          in: path
          type: string
          description: The name or ID of the flow.
          required: true
        - name: runId
          in: path
          type: string
