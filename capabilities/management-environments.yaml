  tags:
  - Microsoft Power Automate
  - Environments
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_POWER_AUTOMATE_API_KEY: MICROSOFT_POWER_AUTOMATE_API_KEY
capability:
